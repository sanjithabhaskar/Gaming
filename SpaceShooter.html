<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Space Shooter</title>
    <style>
        body {
            background-color: #0d0d1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        h1 {
            margin: 0 0 5px 0;
            font-size: 22px;
            color: #a855f7;
            text-shadow: 0 0 10px rgba(168, 85, 247, 0.5);
            letter-spacing: 2px;
        }
        #canvas-container {
            border: 3px solid #8b5cf6;
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(139, 92, 246, 0.5);
            overflow: hidden;
            background: #090612;
        }
        canvas {
            display: block;
        }
        .controls {
            margin-top: 8px;
            font-size: 13px;
            color: #9ca3af;
        }
    </style>
</head>
<body>

    <h1>SPACE SHOOTER</h1>
    <div id="canvas-container">
        <!-- Resized height to fit standard screens perfectly -->
        <canvas id="gameCanvas" width="550" height="620"></canvas>
    </div>
    <div class="controls">
        Controls: <b>A / D</b> or <b>Left / Right Arrows</b> to Move | <b>Spacebar</b> to Shoot | <b>R</b> to Restart
    </div>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        const WIDTH = canvas.width;
        const HEIGHT = canvas.height;

        let score = 0;
        let lives = 3;
        let gameOver = false;

        let player = {
            x: WIDTH / 2,
            y: HEIGHT - 50,
            width: 36,
            height: 36,
            speed: 7
        };

        let bullets = [];
        let enemies = [];
        let keys = {};

        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'Space' && !gameOver) {
                bullets.push({ x: player.x, y: player.y - 20, speed: 10 });
                e.preventDefault();
            }
            if (e.code === 'KeyR' && gameOver) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        function resetGame() {
            score = 0;
            lives = 3;
            gameOver = false;
            bullets = [];
            enemies = [];
            spawnEnemies();
        }

        function spawnEnemies() {
            for (let i = 0; i < 6; i++) {
                enemies.push({
                    x: Math.random() * (WIDTH - 60) + 30,
                    y: Math.random() * -300 - 30,
                    speed: Math.random() * 2 + 2,
                    size: 20
                });
            }
        }

        spawnEnemies();

        function update() {
            if (gameOver) return;

            if ((keys['ArrowLeft'] || keys['KeyA']) && player.x > 25) {
                player.x -= player.speed;
            }
            if ((keys['ArrowRight'] || keys['KeyD']) && player.x < WIDTH - 25) {
                player.x += player.speed;
            }

            for (let i = bullets.length - 1; i >= 0; i--) {
                bullets[i].y -= bullets[i].speed;
                if (bullets[i].y < 0) {
                    bullets.splice(i, 1);
                }
            }

            for (let i = enemies.length - 1; i >= 0; i--) {
                enemies[i].y += enemies[i].speed;

                let dx = player.x - enemies[i].x;
                let dy = player.y - enemies[i].y;
                let dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < 30) {
                    lives--;
                    enemies.splice(i, 1);
                    enemies.push({
                        x: Math.random() * (WIDTH - 60) + 30,
                        y: Math.random() * -150 - 20,
                        speed: Math.random() * 2 + 2,
                        size: 20
                    });
                    if (lives <= 0) {
                        gameOver = true;
                    }
                    continue;
                }

                for (let b = bullets.length - 1; b >= 0; b--) {
                    let bdx = bullets[b].x - enemies[i].x;
                    let bdy = bullets[b].y - enemies[i].y;
                    let bdist = Math.sqrt(bdx * bdx + bdy * bdy);
                    if (bdist < 25) {
                        score += 10;
                        bullets.splice(b, 1);
                        enemies.splice(i, 1);
                        enemies.push({
                            x: Math.random() * (WIDTH - 60) + 30,
                            y: Math.random() * -150 - 20,
                            speed: Math.random() * 2 + 2,
                            size: 20
                        });
                        break;
                    }
                }

                if (enemies[i] && enemies[i].y > HEIGHT + 30) {
                    enemies[i].y = Math.random() * -150 - 20;
                    enemies[i].x = Math.random() * (WIDTH - 60) + 30;
                }
            }
        }

        function draw() {
            ctx.fillStyle = "#090612";
            ctx.fillRect(0, 0, WIDTH, HEIGHT);

            // Draw Player Ship (Neon Cyan)
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(player.x, player.y - 20);
            ctx.lineTo(player.x - 18, player.y + 18);
            ctx.lineTo(player.x, player.y + 10);
            ctx.lineTo(player.x + 18, player.y + 18);
            ctx.closePath();
            ctx.stroke();

            // Draw Bullets
            ctx.strokeStyle = "#00f0ff";
            ctx.lineWidth = 3;
            for (let bullet of bullets) {
                ctx.beginPath();
                ctx.moveTo(bullet.x, bullet.y);
                ctx.lineTo(bullet.x, bullet.y - 12);
                ctx.stroke();
            }

            // Draw Enemies (Neon Red)
            ctx.strokeStyle = "#ff3250";
            ctx.lineWidth = 3;
            for (let enemy of enemies) {
                ctx.beginPath();
                ctx.moveTo(enemy.x - 15, enemy.y - 12);
                ctx.lineTo(enemy.x + 15, enemy.y - 12);
                ctx.lineTo(enemy.x, enemy.y + 15);
                ctx.closePath();
                ctx.stroke();
            }

            // UI
            ctx.fillStyle = "#ffffff";
            ctx.font = "bold 16px monospace";
            ctx.fillText(`SCORE: ${score}`, 20, 30);
            
            let hearts = "♥ ".repeat(lives);
            ctx.fillStyle = "#ff3250";
            ctx.fillText(`LIVES: ${hearts}`, WIDTH - 130, 30);

            if (gameOver) {
                ctx.fillStyle = "rgba(13, 10, 25, 0.85)";
                ctx.fillRect(0, 0, WIDTH, HEIGHT);

                ctx.fillStyle = "#ff3250";
                ctx.font = "bold 32px monospace";
                ctx.textAlign = "center";
                ctx.fillText("GAME OVER", WIDTH / 2, HEIGHT / 2 - 20);

                ctx.fillStyle = "#ffffff";
                ctx.font = "bold 16px monospace";
                ctx.fillText("Press 'R' to Restart", WIDTH / 2, HEIGHT / 2 + 25);
                ctx.textAlign = "left";
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
